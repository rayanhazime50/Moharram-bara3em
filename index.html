<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة دمعة  - ألعاب عاشوراء</title>

<style>
body {
    margin: 0;
    font-family: "Tahoma", sans-serif;
    background: radial-gradient(circle at top, #2b0000, #000);
    color: white;
    overflow-x: hidden;
    user-select: none;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(255, 0, 0, 0.15), transparent 40%),
                radial-gradient(circle at 80% 60%, rgba(255, 215, 0, 0.08), transparent 40%);
    pointer-events: none;
}

.screen { display: none; padding: 20px; max-width: 600px; margin: auto; }
.active { display: block; }

.card {
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 215, 0, 0.1);
    border-radius: 24px;
    padding: 25px;
    margin-top: 15px;
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
    text-align: center;
}

h2, h3 { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

input {
    width: 100%; padding: 15px; margin: 15px 0;
    border: 2px solid #ffd700; border-radius: 16px;
    background: rgba(0,0,0,0.8); color: white; font-size: 18px;
    text-align: center; box-sizing: border-box;
}

button {
    width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 16px;
    background: linear-gradient(90deg, #8b0000, #4a0000); color: white;
    font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
}
button:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }

.badge { background: rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 50px; display: inline-block; font-size: 16px; border: 1px solid rgba(255,215,0,0.2); margin: 5px; }

.day-card {
    background: rgba(40, 0, 0, 0.6); border: 2px solid rgba(255, 0, 0, 0.3);
    padding: 18px; margin-top: 12px; border-radius: 18px; cursor: pointer;
    font-size: 18px; display: flex; justify-content: space-between; transition: 0.3s;
}
.day-card:hover { transform: translateY(-3px); background: rgba(70, 0, 0, 0.8); }

/* الألعاب */
.memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
.memory-card { 
    height: 80px; background: #4a0000; border: 2px solid #ffd700; border-radius: 12px; 
    display: flex; align-items: center; justify-content: center; 
    cursor: pointer; transition: background 0.2s; overflow: hidden;
}
.memory-card img { width: 100%; height: 100%; object-fit: cover; display: none; }
.memory-card.revealed { background: #ffd700; }
.memory-card.revealed img { display: block; }

#gameCanvas { background: #1a0000; border: 2px solid #ffd700; border-radius: 16px; display: block; margin: 15px auto; max-width: 100%; }

.color-picker { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.color-dot { width: 40px; height: 40px; border-radius: 50px; cursor: pointer; border: 2px solid white; }
.paint-svg { width: 250px; height: 250px; background: rgba(255,255,255,0.9); border-radius: 16px; padding: 10px; margin: 20px auto; display: block; }
.paint-clickable { fill: #ffffff; stroke: #000000; stroke-width: 1.5; cursor: pointer; transition: fill 0.2s; }

.puzzle-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 240px; height: 240px; margin: 20px auto; }
.puzzle-piece { width: 116px; height: 116px; background-size: 240px 240px; border: 2px dashed #ffd700; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<!-- شاشة البداية -->
<div class="screen active" id="startScreen">
    <div class="card">
        <h2>🏴 رحلة دمعة 🏴</h2>
        <p>مرحباً بك يا بطل/ة في ألعاب عاشوراء اليومية</p>
        <input id="name" placeholder="اكتب/ي اسمك  هنا...">
        <button onclick="startGame()">ابدأ/ي الرحلة 🚩</button>
    </div>
</div>

<!-- الشاشة الرئيسية -->
<div class="screen" id="homeScreen">
    <div class="card">
        <span class="badge">🚩 الرايات: <span id="flags">0</span> / 10</span>
        <span class="badge">🪣 مجموع ما جمعته: <span id="totalItemsScore">0</span></span>
    </div>
    <div class="card">
        <h3>خريطة الأيام العشرة</h3>
        <div id="daysContainer"></div>
    </div>
</div>

<!-- شاشة القصة -->
<div class="screen" id="storyScreen">
    <div class="card">
        <h2 id="storyTitle"></h2>
        <p>اضغط/ي على الزر أدناه لبدء تحديات اليوم الممتعة!</p>
        <button onclick="startDailyGames()">جاهز/ة للعب والتحدي! 🎮</button>
    </div>
</div>

<!-- شاشة محرك الألعاب -->
<div class="screen" id="gameScreen">
    <div class="card">
        <h3 id="gameTypeTitle"></h3>
        <p id="gameInstructions"></p>
        
        <div id="gameContainer"></div>

        <button id="nextGameBtn" style="display:none;" onclick="nextGame()">الانتقال للعبة التالية ✨</button>
    </div>
</div>

<script>
/* ================= بيانات الـ 10 أيام مع روابط صور الميموري والبازل ================= */
// وضعنا صوراً تجريبية من الإنترنت لتري النتيجة فوراً (يمكنك استبدال الروابط بصورك الخاصة لاحقاً)
const daysData = [
    { 
        title: "اليوم 1: هلال محرم", 
        emoji: "🌙", 
        memoryImages: ["Mem1.jpeg", "Mem2.jpeg", "Mem3.jpeg", "Mem4.jpeg"],
        puzzleImg: "Puzz1.jpeg", 
        svgPaths: ["M50,10 Q80,40 50,90 Q65,60 50,10 Z", "M20,20 L40,20 L30,40 Z"] 
    },
    { 
        title: "اليوم 2: خيام كربلاء", 
        emoji: "⛺", 
        memoryImages: ["https://picsum.photos/100/100?random=21", "https://picsum.photos/100/100?random=22", "https://picsum.photos/100/100?random=23", "https://picsum.photos/100/100?random=24"],
        puzzleImg: "https://picsum.photos/240/240?random=2", 
        svgPaths: ["M50,10 L90,80 L10,80 Z", "M40,80 L40,95 L60,95 L60,80 Z"] 
    },
    { 
        title: "اليوم 3: السيدة رقية (ع)", 
        emoji: "🕯️", 
        memoryImages: ["https://picsum.photos/100/100?random=31", "https://picsum.photos/100/100?random=32", "https://picsum.photos/100/100?random=33", "https://picsum.photos/100/100?random=34"],
        puzzleImg: "https://picsum.photos/240/240?random=3", 
        svgPaths: ["M50,30 Q70,50 50,90 Q30,50 50,30 Z"] 
    },
    { 
        title: "اليوم 4: أصحاب الحسين", 
        emoji: "🛡️", 
        memoryImages: ["https://picsum.photos/100/100?random=41", "https://picsum.photos/100/100?random=42", "https://picsum.photos/100/100?random=43", "https://picsum.photos/100/100?random=44"],
        puzzleImg: "https://picsum.photos/240/240?random=4", 
        svgPaths: ["M10,10 L90,10 L50,90 Z"] 
    },
    { 
        title: "اليوم 5: السيدة زينب (ع)", 
        emoji: "🕌", 
        memoryImages: ["https://picsum.photos/100/100?random=51", "https://picsum.photos/100/100?random=52", "https://picsum.photos/100/100?random=53", "https://picsum.photos/100/100?random=54"],
        puzzleImg: "https://picsum.photos/240/240?random=5", 
        svgPaths: ["M20,90 L20,40 L50,10 L80,40 L80,90 Z"] 
    },
    { 
        title: "اليوم 6: القاسم بن الحسن", 
        emoji: "🌿", 
        memoryImages: ["https://picsum.photos/100/100?random=61", "https://picsum.photos/100/100?random=62", "https://picsum.photos/100/100?random=63", "https://picsum.photos/100/100?random=64"],
        puzzleImg: "https://picsum.photos/240/240?random=6", 
        svgPaths: ["M50,15 L80,85 L20,85 Z"] 
    },
    { 
        title: "اليوم 7: قمر بني هاشم", 
        emoji: "💧", 
        memoryImages: ["https://picsum.photos/100/100?random=71", "https://picsum.photos/100/100?random=72", "https://picsum.photos/100/100?random=73", "https://picsum.photos/100/100?random=74"],
        puzzleImg: "https://picsum.photos/240/240?random=7", 
        svgPaths: ["M50,10 C50,10 90,50 90,70 C90,85 70,95 50,95 C30,95 10,85 10,70 C10,50 50,10 50,10 Z"] 
    },
    { 
        title: "اليوم 8: علي الأكبر (ع)", 
        emoji: "🐎", 
        memoryImages: ["https://picsum.photos/100/100?random=81", "https://picsum.photos/100/100?random=82", "https://picsum.photos/100/100?random=83", "https://picsum.photos/100/100?random=84"],
        puzzleImg: "https://picsum.photos/240/240?random=8", 
        svgPaths: ["M10,50 L50,10 L90,50 L50,90 Z"] 
    },
    { 
        title: "اليوم 9: الطفل الرضيع", 
        emoji: "🍼", 
        memoryImages: ["https://picsum.photos/100/100?random=91", "https://picsum.photos/100/100?random=92", "https://picsum.photos/100/100?random=93", "https://picsum.photos/100/100?random=94"],
        puzzleImg: "https://picsum.photos/240/240?random=9", 
        svgPaths: ["M30,20 L70,20 L70,80 L30,80 Z"] 
    },
    { 
        title: "اليوم 10: انتصار الحسين", 
        emoji: "🏆", 
        memoryImages: ["https://picsum.photos/100/100?random=101", "https://picsum.photos/100/100?random=102", "https://picsum.photos/100/100?random=103", "https://picsum.photos/100/100?random=104"],
        puzzleImg: "https://picsum.photos/240/240?random=10", 
        svgPaths: ["M50,50 L90,90 L10,90 Z"] 
    }
];

/* ================= الـ STATE ================= */
let state = { 
    name: "", 
    currentDayIndex: 0, 
    flags: 0, 
    totalCollected: 0, 
    completedDays: [] 
};

let currentGameStep = 1;

window.onload = function() { 
    switchScreen("startScreen");
};

function startGame() {
    let nameInput = document.getElementById("name");
    if (!nameInput) return;
    let name = nameInput.value.trim();
    if (!name) return alert("من فضلك اكتب اسمك!");
    state.name = name;
    showHome();
}

function showHome() {
    switchScreen("homeScreen");
    document.getElementById("flags").innerText = state.flags;
    document.getElementById("totalItemsScore").innerText = state.totalCollected;
    renderDays();
}

function renderDays() {
    let html = "";
    daysData.forEach((d, i) => {
        let completed = state.completedDays.includes(i) ? "✅ مكتمل" : "";
        html += `
            <div class="day-card" onclick="openDay(${i})">
                <span>${d.emoji} ${d.title}</span>
                <span>${completed}</span>
            </div>
        `;
    });
    document.getElementById("daysContainer").innerHTML = html;
}

function openDay(index) {
    state.currentDayIndex = index;
    currentGameStep = 1; 
    switchScreen("storyScreen");
    document.getElementById("storyTitle").innerText = daysData[index].title;
}

function startDailyGames() {
    switchScreen("gameScreen");
    loadGameEngine();
}

/* ================= محرك الألعاب المطور ================= */
function loadGameEngine() {
    let container = document.getElementById("gameContainer");
    let nextBtn = document.getElementById("nextGameBtn");
    nextBtn.style.display = "none";
    container.innerHTML = "";
    
    let currentDay = daysData[state.currentDayIndex];

    if (currentGameStep === 1) {
        // --- 1. لعبة الذاكرة بالصور الفردية المصغرة ---
        document.getElementById("gameTypeTitle").innerText = "اللعبة 1: أين الصور المتشابهة؟ 🧠";
        document.getElementById("gameInstructions").innerText = "اضغط على بطاقتين لمطابقتها!";
        
        let grid = document.createElement("div");
        grid.className = "memory-grid";
        
        // نكرر الصور الـ 4 ليصبح لدينا 8 بطاقات (كل صورتين متطابقتين)
        let items = [...currentDay.memoryImages, ...currentDay.memoryImages];
        items.sort(() => 0.5 - Math.random());
        
        let selectedCards = [];
        let matchedCount = 0;

        items.forEach((imgUrl) => {
            let card = document.createElement("div");
            card.className = "memory-card";
            
            let img = document.createElement("img");
            img.src = imgUrl;
            card.appendChild(img);
            
            card.onclick = function() {
                if (selectedCards.length < 2 && !card.classList.contains("revealed")) {
                    card.classList.add("revealed");
                    selectedCards.push(card);
                    
                    if (selectedCards.length === 2) {
                        let img1 = selectedCards[0].querySelector("img").src;
                        let img2 = selectedCards[1].querySelector("img").src;
                        
                        if (img1 === img2) {
                            matchedCount += 2;
                            selectedCards = [];
                            if (matchedCount === items.length) nextBtn.style.display = "block";
                        } else {
                            setTimeout(() => {
                                selectedCards[0].classList.remove("revealed");
                                selectedCards[1].classList.remove("revealed");
                                selectedCards = [];
                            }, 800);
                        }
                    }
                }
            };
            grid.appendChild(card);
        });
        container.appendChild(grid);

    } else if (currentGameStep === 2) {
        // --- 2. لعبة التجمع ---
        document.getElementById("gameTypeTitle").innerText = "اللعبة 2: تجميع رايات الخير والبركة 🪣";
        document.getElementById("gameInstructions").innerText = "اجمع 5 عناصر لتحريك العداد العام للعبة!";
        
        let canvas = document.createElement("canvas");
        canvas.id = "gameCanvas"; canvas.width = 300; canvas.height = 300;
        container.appendChild(canvas);
        
        let ctx = canvas.getContext("2d");
        let basket = { x: 130, y: 270, w: 50, h: 15 };
        let item = { x: Math.random() * 250, y: 0, speed: 3.5 };
        let localScore = 0;
        
        canvas.onmousemove = function(e) { basket.x = e.offsetX - 25; };
        canvas.ontouchmove = function(e) { 
            let rect = canvas.getBoundingClientRect();
            if(e.touches[0]) basket.x = e.touches[0].clientX - rect.left - 25; 
        };

        function updateCanvas() {
            if (!document.getElementById("gameCanvas")) return;
            ctx.clearRect(0, 0, 300, 300);
            ctx.fillStyle = "#ffd700"; ctx.fillRect(basket.x, basket.y, basket.w, basket.h);
            ctx.font = "24px Arial"; ctx.fillText(currentDay.emoji, item.x, item.y);
            
            item.y += item.speed;
            if (item.y > 260 && item.x > basket.x - 10 && item.x < basket.x + 50) {
                localScore++; 
                state.totalCollected++; 
                item.y = 0; item.x = Math.random() * 250;
            } else if (item.y > 300) { item.y = 0; item.x = Math.random() * 250; }
            
            if (localScore >= 5) {
                ctx.fillStyle = "#00ff00"; ctx.font = "18px Tahoma"; ctx.fillText("رائع! زاد رصيدك العام بقيمة 5 🚀", 25, 150);
                document.getElementById("totalItemsScore").innerText = state.totalCollected; 
                nextBtn.style.display = "block";
            } else { requestAnimationFrame(updateCanvas); }
        }
        updateCanvas();

    } else if (currentGameStep === 3) {
        // --- 3. لعبة التلوين ---
        document.getElementById("gameTypeTitle").innerText = "اللعبة 3: لوّن رسمة اليوم المخصصة 🎨";
        document.getElementById("gameInstructions").innerText = "اختر لوناً، ثم اضغط على أجزاء الرسمة البيضاء لتلوينها!";
        
        let selectedColor = "#ffd700";
        let colors = ["#8b0000", "#006400", "#ffd700", "#00008b", "#ffffff", "#000000"];
        
        let pickerDiv = document.createElement("div");
        pickerDiv.className = "color-picker";
        colors.forEach(c => {
            let dot = document.createElement("div");
            dot.className = "color-dot"; dot.style.backgroundColor = c;
            dot.onclick = function() { selectedColor = c; };
            pickerDiv.appendChild(dot);
        });
        container.appendChild(pickerDiv);
        
        let svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 100 100"); svg.className = "paint-svg";
        
        currentDay.svgPaths.forEach(pData => {
            let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pData);
            path.className = "paint-clickable";
            path.onclick = function() { 
                path.style.fill = selectedColor; 
                nextBtn.style.display = "block"; 
            };
            svg.appendChild(path);
        });
        container.appendChild(svg);

    } else if (currentGameStep === 4) {
        // --- 4. لعبة البازل المؤتمتة (ينقله فوراً عند الفوز) ---
        document.getElementById("gameTypeTitle").innerText = "اللعبة 4: رتّب بازل لوحة اليوم 🧩";
        document.getElementById("gameInstructions").innerText = "اضغط على قطعتين لتبديل أماكنهما وإكمال اللوحة الحسينية!";
        
        let puzzleDiv = document.createElement("div");
        puzzleDiv.className = "puzzle-container";
        
        let piecesOrder = [0, 1, 2, 3].sort(() => 0.5 - Math.random());
        let selectedPiece = null;

        function renderPuzzle() {
            puzzleDiv.innerHTML = "";
            piecesOrder.forEach((pos, index) => {
                let piece = document.createElement("div");
                piece.className = "puzzle-piece";
                piece.style.backgroundImage = `url('${currentDay.puzzleImg}')`;
                
                let x = (pos % 2) * 120;
                let y = Math.floor(pos / 2) * 120;
                piece.style.backgroundPosition = `-${x}px -${y}px`;
                
                piece.onclick = function() {
                    if (selectedPiece === null) {
                        selectedPiece = index;
                        piece.style.borderColor = "#00ff00";
                    } else {
                        let temp = piecesOrder[selectedPiece];
                        piecesOrder[selectedPiece] = piecesOrder[index];
                        piecesOrder[index] = temp;
                        selectedPiece = null;
                        renderPuzzle();
                        
                        // التحقق المباشر من الفوز والعودة التلقائية لصفحة الأيام
                        if (JSON.stringify(piecesOrder) === JSON.stringify([0, 1, 2, 3])) {
                            setTimeout(() => {
                                alert("أحسنت يا بطل! لقد اكتملت الصورة 🌟");
                                if (!state.completedDays.includes(state.currentDayIndex)) {
                                    state.completedDays.push(state.currentDayIndex);
                                    state.flags++;
                                }
                                showHome(); // العودة المباشرة والتلقائية
                            }, 300);
                        }
                    }
                };
                puzzleDiv.appendChild(piece);
            });
        }
        renderPuzzle();
        container.appendChild(puzzleDiv);
    }
}

function nextGame() {
    if (currentGameStep < 4) {
        currentGameStep++;
        loadGameEngine();
    }
}

function switchScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
